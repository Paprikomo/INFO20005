<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete" />
</head>

<body>
    <nav>
        <figure>
            <a href="index.html">
                <img class="nav-logo" src="images/logo.png" alt="Logo">
            </a>
        </figure>
        
        <div class="nav-buttons">
            <a class="nav-shop" href="product-list.html">SHOP</a>
            <h2 class="nav-about">ABOUT</h2>
            <a class="nav-cart" href="cart.html">CART</a>
        </div>
    </nav>
  
    <header class="cart-page-header">
        <a class="back-button" href="javascript:history.back()">BACK</a>

        <div class="header-line"></div>
        <h1 class="cart-title">CART</h1>
        <div class="header-line"></div>

    </header>

    <main>
        <img class="spike-border" src="images/white-spike.png"> 

        <section class="cart-section">

            <div class="cart-row">

                <div class="cart-row-info">
                    <img class="cart-image" src="images/little_temperance.webp">

                    <div class="cart-row-middle">
                        <h2>LITTLE TEMPERANCE</h2>
                        
                        <p>$18.00<br>
                            Size: 1KG<br>
                            Grind: Espresso
                        </p>

                        <div class="cart-quantity-pick">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </div>


                </div>

                <div class="cart-row-right">
                        <!--trash can-->
                    <p>$18.00</p>
                </div>

            </div>

            <div class="cart-checkout">
                <div class="cart-price">
                    <p>Subtotal</p>
                    <p>$36.00</p>
                </div>


                <a>CHECKOUT</a>
            </div>
            


        </section>

        <img class="footer-lines-border" src="images/footer_lines.png">

    </main>

    <footer>
        <div class="footer-row-one">
            <div class="footer-left">
                <p>
                    Shop 3 188 Little Collins St <br>
                    Melbourne 3000, Victoria
                </p>
            </div>

            <div class="footer-center">
                <figure>
                    <img class="footer-image" src="images/logo.png">
                </figure>

                <figcaption>
                    <p>MADE IN MELBOURNE</p>
                </figcaption>
            </div>

            <div class="footer-right">
                <p>
                    0425 218 879 <br>
                    othersidecoffee@gmail.com
                </p>
            </div>

        </div>

        <div class="footer-links">
            <p>INSTAGRAM</p>
            <p>ACCOUNT</p>
            <p>CONTACT</p>
            <p>TERMS</p>
            <p>LOCATION</p>
        </div>

        <p class="copyright">© OTHERSIDE Coffee</p>
    </footer>
</body>
</html>
