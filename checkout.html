<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otherside Checkout</title>
    <link rel="stylesheet" href="style.css">

</head>
<body class="checkout-body">
    <nav>
        <figure>
            <a href="index.html">
                <img class="nav-logo" src="images/logo.png" alt="Logo">
            </a>
        </figure>
        
        <div class="nav-buttons">
            <a class="nav-shop" href="product-list.html">
                <p>SHOP</p>
            </a>

            <h2 class="nav-about">ABOUT</h2>
            
            <div class="cart-wrapper" id="cartBtn">
                <a class="nav-cart" href="cart.html">
                    <p>CART</p>
                </a>

                <div class="hover-cart" id="hoverCart">
                    <div class="hover-container" id="hoverContainer"></div>

                    
                    <p id="emptyText" class="empty-text">YOUR CART IS EMPTY</p>
                    <button id="closeCart" class="close-cart">CONTINUE SHOPPING</button>
                </div>
            </div>
        </div>

        <div class="mobile-icons">
            <a class="nav-cart-icon" href="cart.html">
                <img src="images/cart_icon.png">
            </a>

            <a class="nav-menu-icon" href="mobile-menu.html">
                <img src="images/menu_icon.png">
            </a>
        </div>
    </nav>

    <header class="checkout-header">
        <a class="back-button" href="javascript:history.back()">BACK</a>

        <div class="header-line"></div>
        <h1 class="checkout-title">CHECKOUT</h1>
        <div class="header-line"></div>
    </header>

    <main>
        
        <img class="spike-border" src="images/white-spike.png"> 

        <span>
            <div>
                <form>
                    <label for="email">EMAIL</label><br>
                    <input type="text" id="email" name="email"><br>

                    <label for="check">Sign up to receive news and updates</label>
                    <input type="checkbox" id="check" name="check">
                </form>

                <h2>CONTINUE</h2>
            </div>
            
            <div>
                <h2>DELIVERY</h2>
                <form>
                    <label for="">Address line 1</label>
                    <input type="text" id="address">
                </form>
            </div>

            <div>
                <h2>PAYMENT</h2>
            </div>

            <div>

            </div>
        </span>

        <aside>
            <div>
                <h1>ORDER SUMMARY</h1>

                <a href="purchase.html">PURCHASE</a>
            </div>
        </aside>

        <img class="footer-lines-border" src="images/footer_lines.png">

    </main>

    <footer>
        <div class="footer-row-one">
            <div class="footer-left">
                <p>
                    Shop 3 188 Little Collins St <br>
                    Melbourne 3000, Victoria
                </p>
            </div>

            <div class="footer-center">
                <figure>
                    <img class="footer-image" src="images/logo.png">
                </figure>

                <figcaption>
                    <p>MADE IN MELBOURNE</p>
                </figcaption>
            </div>

            <div class="footer-right">
                <p>
                    0425 218 879 <br>
                    othersidecoffee@gmail.com
                </p>
            </div>

        </div>

        <div class="footer-links">
            <p>INSTAGRAM</p>
            <p>ACCOUNT</p>
            <p>CONTACT</p>
            <p>TERMS</p>
            <p>LOCATION</p>
        </div>

        <p class="copyright">© OTHERSIDE Coffee</p>
    </footer>
    
</body>
</html>
